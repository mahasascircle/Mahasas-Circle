<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library</title><style>
:root{--bg:#07040c;--panel:#120b1a;--text:#f3eef6;--muted:#beb3c6;--violet:#ba78ec;--line:rgba(235,225,241,.18)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#08050e,#050309);color:var(--text);font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{padding:20px 15px;border-right:1px solid var(--line);background:#08050d;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;font:14px Georgia,serif;letter-spacing:.09em;padding-bottom:20px}.mark{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center}.nav{display:grid;gap:5px}.nav a{padding:11px 12px;border-radius:9px;color:var(--muted)}.nav a:hover,.nav a.active{background:rgba(186,120,236,.13);color:#fff}.main{min-width:0}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(8,5,13,.92)}.search{flex:1;max-width:520px}.search input{width:100%;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff}.btn{padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04);color:#fff;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#843fb2,#50276c);border-color:#bc7de9}.content{max-width:1100px;margin:auto;padding:24px}.hero{padding:22px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#1a1024,#0a0710)}.hero h1{font:400 44px Georgia,serif;margin:0 0 8px}.hero p{margin:0;color:#cec3d4}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filter{padding:8px 11px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);color:var(--muted)}.filter.active{background:rgba(186,120,236,.15);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#120b1a,#09060e);overflow:hidden}.visual{height:130px;display:grid;place-items:center;font-size:52px;background:radial-gradient(circle,rgba(186,120,236,.18),transparent 35%)}.body{padding:16px}.card h2{font:400 21px Georgia,serif;margin:8px 0}.card p{color:#d1c6d6;font-size:13px}.price{font:22px Georgia,serif;color:#d7a4f0;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{margin-top:15px;padding:13px 15px;border-left:3px solid var(--violet);background:rgba(186,120,236,.08)}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 14px;border-radius:999px;background:#eee2f4;color:#160f1b;opacity:0;transition:.2s}.toast.show{opacity:1}.mobile{display:none}
@media(max-width:820px){.shell{display:block}.side{display:none}.content{padding:14px 12px 84px}.grid{grid-template-columns:1fr}.mobile{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#08050d;border-top:1px solid var(--line);padding:8px}.mobile a{text-align:center;font-size:10px;color:var(--muted)}}
.article{padding:16px;border:1px solid var(--line);border-radius:15px;background:#110b19}.article h2{font:400 21px Georgia,serif}.article p{color:#d1c6d6}.full{display:none;margin-top:12px;line-height:1.6}.full.open{display:block}</style></head><body>
<div class="shell">
<aside class="side"><div class="brand"><div class="mark">🔥</div>MAHASA'S CIRCLE</div>
<nav class="nav">
<a href="dashboard.html">Home</a>
<a href="silver-threads.html">Silver Threads</a>
<a href="hearths.html">Hearths</a>
<a href="local-circle.html">Local Circle</a>
<a href="gatherings.html">Gatherings</a>
<a href="marketplace.html">Marketplace</a>
<a href="library.html">Library</a>
</nav></aside>
<main class="main"><header class="top"><div class="search"><input id="q" placeholder="Search guides"></div><button class="btn primary" id="savedBtn">Saved Guides</button></header><div class="content">
<section class="hero"><h1>The Library</h1><p>Guides, traditions, safety resources, and preserved community knowledge.</p></section>
<div class="filters"><button class="filter active" data-cat="all">All</button><button class="filter" data-cat="Moon Work">Moon Work</button><button class="filter" data-cat="Herbalism">Herbalism</button><button class="filter" data-cat="Craftsmanship">Craftsmanship</button><button class="filter" data-cat="Ethics">Ethics</button></div>
<section id="list" style="display:grid;gap:12px"></section><div class="notice">Saved guides remain on this device for the demo.</div>
</div></main></div><nav class="mobile"><a href="dashboard.html">Home</a><a href="silver-threads.html">Threads</a><a href="hearths.html">Hearths</a><a href="local-circle.html">Local</a><a href="marketplace.html">Market</a></nav><div class="toast" id="toast"></div>
<script>
const docs=[
{id:'a',cat:'Moon Work',title:'Understanding the Moon Phases',summary:'A practical guide to the eight lunar phases.',body:'The lunar cycle can be used as a reflective framework for intention, action, gratitude, release, and rest.'},
{id:'b',cat:'Herbalism',title:'Safely Drying and Storing Herbs',summary:'Identification, drying, labeling, and storage.',body:'Correct identification comes first. Dry thoroughly, label clearly, and discard anything showing mold or unusual odor.'},
{id:'c',cat:'Craftsmanship',title:'Working With Naturally Curved Branches',summary:'Preserve character while keeping ritual tools stable.',body:'Follow the grain, inspect for cracks, and avoid forcing a branch into a shape that weakens it.'},
{id:'d',cat:'Ethics',title:'Consent in Spiritual Community',summary:'Boundaries for readings, advice, and privacy.',body:'Ask permission before personal readings or interventions, respect refusal, and protect information shared in confidence.'}
];
let saved=JSON.parse(localStorage.getItem('mcSaved')||'[]'),cat='all',q='',savedOnly=false;
const list=document.getElementById('list'),toast=document.getElementById('toast');
function note(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
function render(){let x=docs.filter(d=>(cat==='all'||d.cat===cat)&&(!savedOnly||saved.includes(d.id))&&(d.title+' '+d.summary+' '+d.body).toLowerCase().includes(q.toLowerCase()));list.innerHTML=x.map(d=>`<article class="article"><small>${d.cat}</small><h2>${d.title}</h2><p>${d.summary}</p><div class="actions"><button class="btn primary read">Read Guide</button><button class="btn save" data-id="${d.id}">${saved.includes(d.id)?'Saved':'Save'}</button></div><div class="full">${d.body}</div></article>`).join('');document.querySelectorAll('.article').forEach((a,i)=>{a.querySelector('.read').onclick=()=>a.querySelector('.full').classList.toggle('open');a.querySelector('.save').onclick=()=>{let id=x[i].id;saved.includes(id)?saved=saved.filter(v=>v!==id):saved.push(id);localStorage.setItem('mcSaved',JSON.stringify(saved));render();note('Library updated.')}})}
document.getElementById('q').oninput=e=>{q=e.target.value;render()};document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');cat=b.dataset.cat;render()});document.getElementById('savedBtn').onclick=()=>{savedOnly=!savedOnly;render();note(savedOnly?'Showing saved guides.':'Showing all guides.')};render();
</script></body></html>
